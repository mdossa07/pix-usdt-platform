name: Refresh dependency lockfile

on:
  push:
    branches:
      - security/dependabot-dependency-review
    paths:
      - package.json
      - apps/api/package.json
      - apps/web/package.json
      - pnpm-workspace.yaml

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact dependency graph and update lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify frozen lockfile installation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh pnpm lockfile for patched dependencies"
          git push origin "${GITHUB_REF_NAME}"
