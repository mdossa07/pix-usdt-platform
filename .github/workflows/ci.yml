name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixsplit_test
          POSTGRES_PASSWORD: pixsplit_test_pass
          POSTGRES_DB: pixsplit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pixsplit_test -d pixsplit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pixsplit_test:pixsplit_test_pass@localhost:5433/pixsplit_test?schema=public
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      REDIS_URL: redis://localhost:6379
      PROMETHEUS_METRICS_TOKEN_FILE: /tmp/pixsplit-prometheus-metrics-token
      ALERTMANAGER_WEBHOOK_URL_FILE: /tmp/pixsplit-alertmanager-webhook-url
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in JWT_SECRET PII_ENCRYPTION_KEY METRICS_BEARER_TOKEN GRAFANA_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Audit dependency vulnerabilities
        run: pnpm audit --audit-level moderate
      - name: Validate Prometheus configuration and alert rules
        run: |
          mkdir -p "$(dirname "$PROMETHEUS_METRICS_TOKEN_FILE")"
          printf '%s' "$METRICS_BEARER_TOKEN" > "$PROMETHEUS_METRICS_TOKEN_FILE"
          chmod 644 "$PROMETHEUS_METRICS_TOKEN_FILE"
          printf '%s' 'https://alerts.pixsplit.invalid/webhook' > "$ALERTMANAGER_WEBHOOK_URL_FILE"
          chmod 644 "$ALERTMANAGER_WEBHOOK_URL_FILE"
          node --test scripts/validate-alertmanager-webhook-url.test.mjs
          node scripts/validate-alertmanager-webhook-url.mjs
          docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml config --quiet
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            -v "$PROMETHEUS_METRICS_TOKEN_FILE:/run/secrets/prometheus_metrics_token:ro" \
            prom/prometheus:v3.16.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            -v "$PROMETHEUS_METRICS_TOKEN_FILE:/run/secrets/prometheus_metrics_token:ro" \
            prom/prometheus:v3.16.0 \
            check config /etc/prometheus/prometheus-alertmanager.yml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 \
            check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint=amtool \
            -v "$PWD/infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            -v "$ALERTMANAGER_WEBHOOK_URL_FILE:/run/secrets/alertmanager_webhook_url:ro" \
            prom/alertmanager:v0.35.1 \
            check-config /etc/alertmanager/alertmanager.yml
          node -e "JSON.parse(require('node:fs').readFileSync('infra/grafana/dashboards/pixsplit-api.json', 'utf8'))"
      - name: Validate PostgreSQL 18 migration Compose overlay
        env:
          POSTGRES_USER: pixsplit_migration
          POSTGRES_PASSWORD: pixsplit-ci-migration-only
          POSTGRES_DB: pixsplit
        run: docker compose -f docker-compose.yml -f docker-compose.postgres18-migration.yml --profile postgres18-migration config --quiet
      - name: Rehearse PostgreSQL 16 to 18 logical migration
        run: bash scripts/postgres-major-upgrade-smoke.sh
      - run: pnpm db:generate
      - run: pnpm lint
      - name: Check Chromium E2E script syntax
        run: node --check apps/api/scripts/browser-auth-e2e.mjs
      - run: pnpm test
      - name: Prepare integration database
        run: pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Start API and web apps for browser authentication E2E
        run: |
          nohup pnpm --filter @pixsplit/api exec tsx src/server.ts >/tmp/pixsplit-api.log 2>&1 &
          nohup pnpm --filter @pixsplit/web exec next dev -p 3000 >/tmp/pixsplit-web.log 2>&1 &
          api_ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4000/health >/dev/null && curl --silent --fail http://127.0.0.1:4000/ready >/dev/null; then
              api_ready=true
              break
            fi
            sleep 2
          done
          if [ "$api_ready" != "true" ]; then
            cat /tmp/pixsplit-api.log
            exit 1
          fi
          web_ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/register >/dev/null; then
              web_ready=true
              break
            fi
            sleep 2
          done
          if [ "$web_ready" != "true" ]; then
            cat /tmp/pixsplit-api.log
            cat /tmp/pixsplit-web.log
            exit 1
          fi
      - name: Start Prometheus and Grafana observability stack
        run: docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml up -d
      - name: Verify Prometheus scrape and Grafana provisioning
        run: |
          prometheus_ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9090/-/ready >/dev/null; then
              prometheus_ready=true
              break
            fi
            sleep 2
          done
          if [ "$prometheus_ready" != "true" ]; then
            docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml logs
            exit 1
          fi

          alertmanager_ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9093/-/ready >/dev/null; then
              alertmanager_ready=true
              break
            fi
            sleep 2
          done
          if [ "$alertmanager_ready" != "true" ]; then
            docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml logs alertmanager
            exit 1
          fi

          alertmanager_registered=false
          for attempt in $(seq 1 30); do
            active_alertmanagers="$(curl --silent --fail 'http://127.0.0.1:9090/api/v1/alertmanagers' || true)"
            if node -e "try { const data=JSON.parse(process.argv[1]); process.exit((data.data?.activeAlertmanagers ?? []).some(item => item.url.includes('alertmanager:9093')) ? 0 : 1) } catch { process.exit(1) }" "$active_alertmanagers"; then
              alertmanager_registered=true
              break
            fi
            sleep 2
          done
          if [ "$alertmanager_registered" != "true" ]; then
            docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml logs
            exit 1
          fi

          grafana_ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/api/health >/dev/null; then
              grafana_ready=true
              break
            fi
            sleep 2
          done
          if [ "$grafana_ready" != "true" ]; then
            docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml logs
            exit 1
          fi

          scrape_ready=false
          for attempt in $(seq 1 60); do
            query="$(curl --silent --fail 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22pixsplit-api%22%7D' || true)"
            if node -e "const data=JSON.parse(process.argv[1]); process.exit(data.data?.result?.[0]?.value?.[1] === '1' ? 0 : 1)" "$query"; then
              scrape_ready=true
              break
            fi
            sleep 2
          done
          if [ "$scrape_ready" != "true" ]; then
            docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml logs
            exit 1
          fi

          dashboard_ready=false
          for attempt in $(seq 1 30); do
            dashboard="$(curl --silent --fail --user "admin:$GRAFANA_ADMIN_PASSWORD" 'http://127.0.0.1:3001/api/search?query=PixSplit' || true)"
            if node -e "try { const items=JSON.parse(process.argv[1]); process.exit(items.some(item => item.uid === 'pixsplit-api') ? 0 : 1) } catch { process.exit(1) }" "$dashboard"; then
              dashboard_ready=true
              break
            fi
            sleep 2
          done
          if [ "$dashboard_ready" != "true" ]; then
            docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml logs
            exit 1
          fi

          rules="$(curl --silent --fail 'http://127.0.0.1:9090/api/v1/rules?type=alert')"
          node -e "const data=JSON.parse(process.argv[1]); process.exit(data.data?.groups?.some(group => group.name === 'pixsplit-api') ? 0 : 1)" "$rules"
      - name: Stop observability stack
        if: always()
        env:
          # Compose validates interpolation even when tearing down containers.
          # This fallback is used only during cleanup if secret generation did not run.
          GRAFANA_ADMIN_PASSWORD: cleanup-only-not-used
        run: |
          mkdir -p "$(dirname "$PROMETHEUS_METRICS_TOKEN_FILE")"
          touch "$PROMETHEUS_METRICS_TOKEN_FILE"
          mkdir -p "$(dirname "$ALERTMANAGER_WEBHOOK_URL_FILE")"
          touch "$ALERTMANAGER_WEBHOOK_URL_FILE"
          docker compose -f docker-compose.observability.yml -f docker-compose.alertmanager.yml down
      - name: Run Chromium browser authentication E2E
        run: |
          mkdir -p /tmp/pixsplit-playwright
          printf '{"private":true,"dependencies":{"playwright":"1.65.1"}}\n' >/tmp/pixsplit-playwright/package.json
          pnpm --dir /tmp/pixsplit-playwright install --no-frozen-lockfile
          pnpm --dir /tmp/pixsplit-playwright exec playwright install --with-deps chromium
          PLAYWRIGHT_PACKAGE_PATH=/tmp/pixsplit-playwright/node_modules/playwright node apps/api/scripts/browser-auth-e2e.mjs
      - name: Prepare isolated auth session schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS auth_session_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=auth_session_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run auth session persistence scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=auth_session_test" pnpm --filter @pixsplit/api exec vitest run src/security/session-revocation.e2e.test.ts
      - name: Prepare isolated merchant webhook schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS merchant_webhooks_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=merchant_webhooks_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run merchant webhook outbox scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=merchant_webhooks_test" pnpm --filter @pixsplit/api exec vitest run src/webhooks/merchant-webhooks.e2e.test.ts
      - name: Prepare isolated migration verification schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS migration_test;'
      - name: Verify deployable migrations from an empty schema
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=migration_test" pnpm --filter @pixsplit/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Run financial integration scenarios
        run: pnpm --filter @pixsplit/api exec vitest run src/payments/orchestrator.e2e.test.ts
      - name: Prepare isolated reconciliation lock schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS reconciliation_lock_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=reconciliation_lock_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run PostgreSQL reconciliation lock scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=reconciliation_lock_test" pnpm --filter @pixsplit/api exec vitest run src/payments/reconciliation.e2e.test.ts
      - name: Prepare isolated payment idempotency schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS payment_idempotency_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=payment_idempotency_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run payment idempotency integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=payment_idempotency_test" pnpm --filter @pixsplit/api exec vitest run src/payments/idempotent-payment.e2e.test.ts src/payments/merchant-payment-idempotency.e2e.test.ts
      - name: Prepare isolated merchant payment reservation review schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS admin_payment_reservation_review_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=admin_payment_reservation_review_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run admin merchant payment reservation review scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=admin_payment_reservation_review_test" pnpm --filter @pixsplit/api exec vitest run src/payments/admin-idempotency-review.e2e.test.ts
      - name: Prepare isolated HMAC integration schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS hmac_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=hmac_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run merchant HMAC integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=hmac_test" pnpm --filter @pixsplit/api exec vitest run src/security/hmac-auth.test.ts
      - name: Prepare isolated webhook integration schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS webhook_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=webhook_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run webhook claim integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=webhook_test" pnpm --filter @pixsplit/api exec vitest run src/webhooks/event-claim.test.ts
      - name: Prepare isolated admin TOTP recovery schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS admin_totp_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=admin_totp_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run admin TOTP recovery integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=admin_totp_test" pnpm --filter @pixsplit/api exec vitest run src/security/two-factor-recovery.e2e.test.ts
      - name: Build production artifacts
        run: pnpm build
        env:
          # Next.js uses NODE_ENV=production for builds; use an HTTPS-only placeholder here.
          # Runtime deployments must provide their actual public HTTPS API origin.
          NEXT_PUBLIC_API_URL: https://api.pixsplit.invalid
