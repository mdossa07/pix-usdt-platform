name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixsplit_test
          POSTGRES_PASSWORD: pixsplit_test_pass
          POSTGRES_DB: pixsplit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pixsplit_test -d pixsplit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pixsplit_test:pixsplit_test_pass@localhost:5433/pixsplit_test?schema=public
      JWT_SECRET: pixsplit-test-jwt-secret-at-least-32-characters
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm test
      - name: Prepare integration database
        run: pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Prepare isolated auth session schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS auth_session_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=auth_session_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run auth session persistence scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=auth_session_test" pnpm --filter @pixsplit/api exec vitest run src/security/session-revocation.e2e.test.ts
      - name: Prepare isolated merchant webhook schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS merchant_webhooks_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=merchant_webhooks_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run merchant webhook outbox scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=merchant_webhooks_test" pnpm --filter @pixsplit/api exec vitest run src/webhooks/merchant-webhooks.e2e.test.ts
      - name: Prepare isolated migration verification schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS migration_test;'
      - name: Verify deployable migrations from an empty schema
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=migration_test" pnpm --filter @pixsplit/api exec prisma migrate deploy --schema prisma/schema.prisma
      - name: Run financial integration scenarios
        run: pnpm --filter @pixsplit/api exec vitest run src/payments/orchestrator.e2e.test.ts
      - name: Prepare isolated payment idempotency schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS payment_idempotency_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=payment_idempotency_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run payment idempotency integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=payment_idempotency_test" pnpm --filter @pixsplit/api exec vitest run src/payments/idempotent-payment.e2e.test.ts
      - name: Prepare isolated HMAC integration schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS hmac_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=hmac_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run merchant HMAC integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=hmac_test" pnpm --filter @pixsplit/api exec vitest run src/security/hmac-auth.test.ts
      - name: Prepare isolated webhook integration schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS webhook_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=webhook_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run webhook claim integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=webhook_test" pnpm --filter @pixsplit/api exec vitest run src/webhooks/event-claim.test.ts
      - name: Prepare isolated admin TOTP recovery schema
        run: |
          pnpm --filter @pixsplit/api exec prisma db execute --schema prisma/schema.prisma --stdin <<< 'CREATE SCHEMA IF NOT EXISTS admin_totp_test;'
          DATABASE_URL="${DATABASE_URL%schema=public}schema=admin_totp_test" pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run admin TOTP recovery integration scenarios
        run: DATABASE_URL="${DATABASE_URL%schema=public}schema=admin_totp_test" pnpm --filter @pixsplit/api exec vitest run src/security/two-factor-recovery.e2e.test.ts
      - run: pnpm build
