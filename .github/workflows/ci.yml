name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixsplit_test
          POSTGRES_PASSWORD: pixsplit_test_pass
          POSTGRES_DB: pixsplit_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pixsplit_test -d pixsplit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pixsplit_test:pixsplit_test_pass@localhost:5433/pixsplit_test?schema=public
      JWT_SECRET: pixsplit-test-jwt-secret-at-least-32-characters
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm test
      - name: Prepare integration database
        run: pnpm --filter @pixsplit/api exec prisma db push --schema prisma/schema.prisma
      - name: Run financial integration scenarios
        run: pnpm --filter @pixsplit/api exec vitest run src/payments/orchestrator.e2e.test.ts src/security/hmac-auth.test.ts
      - run: pnpm build
