services:
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - pixsplit_prometheus_data:/prometheus
    secrets:
      - prometheus_metrics_token
    networks:
      - pixsplit_observability
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the environment}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ENFORCE_DOMAIN: "false"
    volumes:
      - pixsplit_grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - pixsplit_observability
    security_opt:
      - no-new-privileges:true

networks:
  pixsplit_observability:
    driver: bridge

volumes:
  pixsplit_prometheus_data:
  pixsplit_grafana_data:

secrets:
  prometheus_metrics_token:
    file: ${PROMETHEUS_METRICS_TOKEN_FILE:?Set PROMETHEUS_METRICS_TOKEN_FILE to the file containing the API METRICS_BEARER_TOKEN}
